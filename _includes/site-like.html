<aside class="home-stats" id="home-stats" aria-label="Site likes">
  <button class="home-stats__like" id="home-like" type="button" aria-label="Like this site">
    <svg class="home-stats__heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78Z"></path></svg>
  </button>
  <span class="home-stats__like-count" id="home-like-count" aria-live="polite">?</span>
</aside>
{% if site.data.engagement_sample %}<script type="application/json" id="home-stats-sample">{{ site.data.engagement_sample | jsonify }}</script>{% endif %}
<script src="{{ '/assets/js/home-stats.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
