name = "x-gx-h-gallery-api"
main = "src/index.js"
compatibility_date = "2026-09-18"

[vars]
ALLOWED_ORIGINS = "https://guoxuan-li.github.io"

[[r2_buckets]]
binding = "GALLERY_IMAGES"
bucket_name = "x-gx-h-gallery-images"

[[d1_databases]]
binding = "GALLERY_DB"
database_name = "x-gx-h-gallery"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
