name: 发布 X_GX_H 网站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 读取网站文件
        uses: actions/checkout@v6
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建网站
        env:
          BLOG_BASEURL: /${{ github.event.repository.name }}
          BLOG_URL: https://${{ github.repository_owner }}.github.io
        run: node scripts/build.mjs
      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 打包网页
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4
