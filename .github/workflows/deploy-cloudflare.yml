name: Build and deploy sample blog

on:
  # Template repository: disable automatic builds on push.
  # push:
  #   branches: [main]
  workflow_dispatch:
  # Template repository: disable the daily scheduled build.
  # schedule:
  #   - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template
        uses: actions/checkout@v4

      - name: Checkout private travel content
        if: ${{ vars.PRIVATE_TRAVEL_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_TRAVEL_REPO }}
          token: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          path: _private-data/travel

      - name: Checkout private writing content
        if: ${{ vars.PRIVATE_WRITING_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_WRITING_REPO }}
          token: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          path: _private-data/writing

      - name: Checkout private recipe content
        if: ${{ vars.PRIVATE_RECIPES_REPO != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PRIVATE_RECIPES_REPO }}
          token: ${{ secrets.PRIVATE_CONTENT_TOKEN }}
          path: _private-data/recipes

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Inject private content
        run: ruby _scripts/sync_private_content.rb
        env:
          TRAVEL_DATA_DIR: ${{ vars.PRIVATE_TRAVEL_REPO != '' && '_private-data/travel' || '' }}
          WRITING_DATA_DIR: ${{ vars.PRIVATE_WRITING_REPO != '' && '_private-data/writing' || '' }}
          RECIPES_DATA_DIR: ${{ vars.PRIVATE_RECIPES_REPO != '' && '_private-data/recipes' || '' }}

      - name: Build Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          BLOG_BACKEND_MODE: cloudflare

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply blog-template-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy _site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
